query CartInput {
  cart {
    buyerIdentity {
      customer {
        wholesaleApproved: metafield(namespace: "$app", key: "wholesale_approved") {
          value
        }
      }
    }
    lines {
      id
      quantity
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            excludedFromWholesale: hasAnyTag(tags: ["no-wholesale"])
          }
        }
      }
    }
  }
  discount {
    discountClasses
  }
  shop {
    tiers: metafield(namespace: "$app", key: "wholesale_tiers") {
      jsonValue
    }
  }
}
